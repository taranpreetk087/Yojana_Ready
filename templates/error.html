{% extends "base.html" %}
{% block title %}{{ code }} - Yojana Ready{% endblock %}
{% block content %}
<div class="card fade-up" style="max-width:640px;margin:5rem auto;text-align:center;padding:4rem 3rem;">
  <span class="category-tag">{{ code }}</span>
  <h1 style="margin-top:1rem;">{{ 'Something went wrong' if lang == 'en' else 'कुछ गलत हो गया' }}</h1>
  <p style="color:var(--text-secondary);font-size:1.1rem;margin:1.5rem 0 2.5rem;">{{ message }}</p>
  <a href="{{ url_for('landing') }}" class="btn btn-primary">{{ 'Back to home' if lang == 'en' else 'होम पेज पर वापस जाएं' }}</a>
</div>
{% endblock %}
